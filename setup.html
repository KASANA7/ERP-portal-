<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — CMS Moon Beverages</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#f4f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{width:100%;max-width:440px;}
.logo-area{text-align:center;margin-bottom:28px;}
.logo-pill{display:inline-block;background:#C8102E;color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;padding:8px 22px;letter-spacing:3px;border-radius:8px;margin-bottom:10px;}
.logo-text{font-family:'Rajdhani',sans-serif;font-size:18px;color:#374151;font-weight:700;}
.logo-sub{font-size:13px;color:#9ca3af;margin-top:3px;}
.card{background:#fff;border:1px solid #e0e2e7;border-radius:10px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.card-title{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:#1a1d23;margin-bottom:4px;}
.card-sub{font-size:13px;color:#6b7280;margin-bottom:24px;}
.fgroup{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#6b7280;margin-bottom:5px;}
input{width:100%;padding:11px 14px;border:1.5px solid #e0e2e7;border-radius:6px;font-size:14px;color:#1a1d23;background:#fff;outline:none;font-family:'DM Sans',sans-serif;transition:border-color .15s,box-shadow .15s;}
input:focus{border-color:#C8102E;box-shadow:0 0 0 3px rgba(200,16,46,.08);}
.btn{width:100%;padding:12px;background:#C8102E;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;transition:background .15s;}
.btn:hover{background:#9a0c22;}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:20px;}
</style>
</head>
<body>
<div class="box">
  <div class="logo-area">
    <div class="logo-pill">MBL</div>
    <div class="logo-text">Contractor Management System</div>
    <div class="logo-sub">Moon Beverages Limited — Dasna</div>
  </div>
  <div class="card">
    <div class="card-title">First Time Setup</div>
    <div class="card-sub">Create your admin account to get started. This page only appears once.</div>
    <div class="note">⚠ After creating your account, this setup page will be permanently disabled.</div>
    <form method="POST">
      <div class="fgroup">
        <label>Full Name</label>
        <input type="text" name="full_name" placeholder="e.g. Kunal Kasana" required autofocus/>
      </div>
      <div class="fgroup">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required/>
      </div>
      <div class="fgroup">
        <label>Password</label>
        <input type="password" name="password" placeholder="Choose a strong password" required/>
      </div>
      <button type="submit" class="btn">Create Account & Start →</button>
    </form>
  </div>
</div>
</body>
</html>
